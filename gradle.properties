# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# AndroidX support
android.useAndroidX=true

# Disable built-in Kotlin if we want to use the plugin explicitly
# (Actually, if we want to follow modern AGP 9.2.1, we might want to keep it enabled, 
# but for now let's try to get it working with explicit plugins if possible)
android.builtInKotlin=false
android.newDsl=false
